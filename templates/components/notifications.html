{% macro actions(alert) %}{% if ui_can_write %}<div class="inventory-links">{% for action,label in [('read','Mark as read'),('dismiss','Dismiss')] %}{% if (action=='read' and not alert.read_at) or (action=='dismiss' and not alert.dismissed_at) %}<form method="post" action="{{ url_for('alerts.action',alert_id=alert.id,action=action) }}"{% if action=='dismiss' %} data-confirm="Dismiss this notification? Its history remains available. A new condition or severity change creates a new notification."{% endif %}><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="small-button" type="submit">{{ label }}</button></form>{% endif %}{% endfor %}</div>{% endif %}{% endmacro %}
