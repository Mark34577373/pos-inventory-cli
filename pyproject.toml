[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
branch = true
source = ["."]
omit = ["tests/*", ".venv/*", "scripts/*"]

[tool.coverage.report]
include_namespace_packages = true
show_missing = true
skip_empty = true
